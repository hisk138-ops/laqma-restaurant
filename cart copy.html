<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة الطلب | لقمة</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="cart.css">
  <script src="cart.js" defer></script>
</head>
<body>
  <header class="menu-header">
    <span class="small-title">LAQMA RESTAURANT</span>
    <h1>🛒 سلة طلبك</h1>
    <p>اختار الإضافات، عدّل الكميات، وجهّز الطلب</p>
    <a href="food.html" class="menu-button">🍔 المأكولات</a>
    <a href="drinks.html" class="menu-button">🥤 المشروبات</a>
    <a href="index.html" class="menu-button">الرئيسية</a>
  </header>
  <main class="cart-page">
    <h2>الأصناف المختارة</h2>
    <div id="cart-items"></div>
    <div class="cart-total-line"><strong>المجموع</strong><strong id="cart-total">0 ₪</strong></div>
    <h2>بيانات الطلب</h2>
    <div class="checkout-fields">
      <label for="customer-name">اسم الزبون *</label>
      <input id="customer-name" type="text" maxlength="80" autocomplete="name" placeholder="الاسم الكامل" required>
      <label for="customer-phone">رقم الهاتف</label>
      <input id="customer-phone" type="tel" maxlength="25" autocomplete="tel" placeholder="مثال: 059xxxxxxx">
      <label for="delivery-method">طريقة الاستلام</label>
      <select id="delivery-method">
        <option value="pickup">استلام من المطعم</option>
        <option value="delivery">توصيل</option>
      </select>
      <div id="address-wrap" hidden>
        <label for="customer-address">عنوان التوصيل *</label>
        <textarea id="customer-address" rows="2" maxlength="250" placeholder="المنطقة، الشارع، علامة مميزة"></textarea>
      </div>
      <label for="order-notes">ملاحظات الطلب</label>
      <textarea id="order-notes" rows="3" maxlength="500" placeholder="مثلاً: بدون بصل، الصوص على جنب..."></textarea>
    </div>
    <button type="button" id="checkout-button" class="checkout-button">تجهيز الطلب عبر واتساب</button>
    <p class="cart-note">الإرسال مش تلقائي: واتساب بيفتح برسالة جاهزة، والزبون بضغط إرسال بنفسه. المجموع لا يشمل رسوم التوصيل المحتملة.</p>
  </main>
</body>
</html>
